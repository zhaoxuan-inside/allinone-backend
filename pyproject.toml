[tool.poetry]
name = "allinone-backend"
version = "0.1.0"
description = "AllInOne Platform Backend"
authors = ["Developer <developer@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
redis = "^5.0.1"
aiokafka = "^0.8.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
bcrypt = "^4.1.2"
httpx = "^0.27.0"
loguru = "^0.7.2"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.14.0"
black = "^24.4.0"
flake8 = "^7.0.0"
isort = "^5.13.0"
mypy = "^1.10.0"
alembic = "^1.13.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"